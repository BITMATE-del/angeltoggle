name: Build AngelToggle Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angeltoggle-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate version
        shell: pwsh
        run: |
          Set-Content -Path app\version.py -Value ('VERSION = "' + $env:APP_VERSION + '"') -Encoding UTF8

      - name: Syntax check
        run: python -m compileall -q app main.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify required stdlib modules
        shell: pwsh
        run: |
          python -c "import pyexpat, xml.parsers.expat, xml.etree.ElementTree; print('XML stdlib OK')"

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "AngelToggle" --hidden-import pyexpat --hidden-import xml.parsers.expat --hidden-import xml.etree.ElementTree --hidden-import xml.dom.minidom --collect-submodules xml main.py
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\AngelToggle.exe release\AngelToggle.exe
          Copy-Item README.md release\README.md
          Compress-Archive -Path release\* -DestinationPath AngelToggle-Windows.zip -Force

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\AngelToggle.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited -and $p.ExitCode -ne 0) {
            throw "AngelToggle.exe exited during smoke test with code $($p.ExitCode)"
          }
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelToggle-Windows
          path: |
            release/AngelToggle.exe
            AngelToggle-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + $env:APP_VERSION
          gh release create $tag release\AngelToggle.exe AngelToggle-Windows.zip --target $env:GITHUB_SHA --title "AngelToggle $tag" --notes "Automatic AngelToggle update build"