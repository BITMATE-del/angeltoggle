name: Build AngelToggle Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angeltoggle-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate version
        shell: pwsh
        run: |
          Set-Content -Path app\version.py -Value ('VERSION = "' + $env:APP_VERSION + '"') -Encoding UTF8

      - name: Syntax check
        run: python -m compileall -q app main.py bootstrap_updater.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build stable onedir application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "AngelToggle" --hidden-import pyexpat --collect-submodules xml --collect-all PySide6 --collect-all shiboken6 main.py
          if (-not (Test-Path dist\AngelToggle\AngelToggle.exe)) { throw "AngelToggle.exe missing from app build" }

      - name: Verify Qt runtime files
        shell: pwsh
        run: |
          $root = "dist\AngelToggle"
          $required = @(
            "_internal\PySide6\QtWidgets.pyd",
            "_internal\PySide6\plugins\platforms\qwindows.dll"
          )
          foreach ($rel in $required) {
            $p = Join-Path $root $rel
            if (-not (Test-Path $p)) {
              Write-Host "Expected path missing: $p"
              Get-ChildItem -Path $root -Recurse -Filter "*QtWidgets*" | ForEach-Object { Write-Host $_.FullName }
              Get-ChildItem -Path $root -Recurse -Filter "qwindows.dll" | ForEach-Object { Write-Host $_.FullName }
              throw "Required Qt runtime file missing: $rel"
            }
          }
          $expat = Get-ChildItem -Path $root -Recurse -Filter pyexpat.pyd | Select-Object -First 1
          if (-not $expat) { throw "pyexpat.pyd missing from onedir build" }

      - name: Add Microsoft VC runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist\AngelToggle\vc_redist.x64.exe"
          if ((Get-Item "dist\AngelToggle\vc_redist.x64.exe").Length -lt 1000000) { throw "VC redistributable download failed" }

      - name: Smoke test onedir application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\AngelToggle\AngelToggle.exe" -WorkingDirectory ".\dist\AngelToggle" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "AngelToggle app exited during smoke test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Build backwards-compatible launcher
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "AngelToggleLauncher" bootstrap_updater.py
          if (-not (Test-Path dist\AngelToggleLauncher.exe)) { throw "Launcher build failed" }

      - name: Create release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\AngelToggle release\AngelToggle -Recurse
          Compress-Archive -Path release\AngelToggle -DestinationPath AngelToggle-Windows.zip -Force
          Copy-Item dist\AngelToggleLauncher.exe release\AngelToggle.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelToggle-Windows
          path: |
            release/AngelToggle.exe
            AngelToggle-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + $env:APP_VERSION
          gh release create $tag release\AngelToggle.exe AngelToggle-Windows.zip --target $env:GITHUB_SHA --title "AngelToggle $tag" --notes "Qt-complete package with Microsoft VC runtime bootstrap"