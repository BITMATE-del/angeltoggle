name: 엔젤토글 Windows 자동 빌드\n\non:\n  push:\n    branches: [ main ]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: angeltoggle-windows-build\n  cancel-in-progress: true\n\njobs:\n  build-windows:\n    runs-on: windows-latest\n    steps:\n      - name: 소스 받기\n        uses: actions/checkout@v4\n\n      - name: Python 준비\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n          cache: "pip"\n\n      - name: 버전 자동 생성\n        shell: pwsh\n        run: |\n          $version = "0.0.${{ github.run_number }}"\n          Set-Content -Path app\\version.py -Value "VERSION = `"$version`"" -Encoding UTF8\n          Write-Host "엔젤토글 버전: $version"\n\n      - name: 문법 검사\n        shell: pwsh\n        run: |\n          python -m compileall -q app main.py\n\n      - name: 의존성 설치\n        run: python -m pip install --upgrade pip && pip install -r requirements.txt\n\n      - name: Windows 실행파일 빌드\n        shell: pwsh\n        run: |\n          pyinstaller --noconfirm --clean --onefile --windowed --name "AngelToggle" main.py\n          New-Item -ItemType Directory -Force -Path release | Out-Null\n          Copy-Item dist\\AngelToggle.exe release\\AngelToggle.exe\n          Copy-Item README.md release\\README.md\n          Compress-Archive -Path release\\* -DestinationPath AngelToggle-Windows.zip -Force\n\n      - name: 빌드 파일 보관\n        uses: actions/upload-artifact@v4\n        with:\n          name: AngelToggle-Windows\n          path: |\n            release/AngelToggle.exe\n            AngelToggle-Windows.zip\n          if-no-files-found: error\n          retention-days: 30\n\n      - name: 자동 업데이트용 릴리스 게시\n        shell: pwsh\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          $tag = "v0.0.${{ github.run_number }}"\n          gh release create $tag release\\AngelToggle.exe AngelToggle-Windows.zip --target $env:GITHUB_SHA --title "엔젤토글 $tag" --notes "엔젤토글 자동 업데이트 빌드"