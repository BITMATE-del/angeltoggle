name: Build AngelToggle Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angeltoggle-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate version
        shell: pwsh
        run: |
          Set-Content -Path app\version.py -Value ('VERSION = "' + $env:APP_VERSION + '"') -Encoding UTF8

      - name: Syntax check
        run: python -m compileall -q app main.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build stable onedir package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "AngelToggle" --hidden-import pyexpat --collect-submodules xml main.py
          if (-not (Test-Path dist\AngelToggle\AngelToggle.exe)) { throw "AngelToggle.exe missing" }
          if (-not (Test-Path dist\AngelToggle\_internal\pyexpat.pyd)) {
            $expat = Get-ChildItem -Path dist\AngelToggle -Recurse -Filter pyexpat.pyd | Select-Object -First 1
            if (-not $expat) { throw "pyexpat.pyd missing from onedir build" }
          }

      - name: Smoke test onedir package
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\AngelToggle\AngelToggle.exe" -WorkingDirectory ".\dist\AngelToggle" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "AngelToggle.exe exited during smoke test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\AngelToggle release\AngelToggle -Recurse
          Compress-Archive -Path release\AngelToggle -DestinationPath AngelToggle-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelToggle-Windows
          path: AngelToggle-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + $env:APP_VERSION
          gh release create $tag AngelToggle-Windows.zip --target $env:GITHUB_SHA --title "AngelToggle $tag" --notes "Stable onedir AngelToggle build"