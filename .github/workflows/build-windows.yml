name: Build AngelToggle Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angeltoggle-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.${{ github.run_number }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate version
        shell: pwsh
        run: |
          Set-Content -Path app\version.py -Value ('VERSION = "' + $env:APP_VERSION + '"') -Encoding UTF8

      - name: Syntax check
        run: python -m compileall -q app main.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build stable application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "AngelToggle" --hidden-import pyexpat --collect-submodules xml --collect-all PySide6 --collect-all shiboken6 main.py
          if (-not (Test-Path dist\AngelToggle\AngelToggle.exe)) { throw "AngelToggle.exe missing" }
          $expat = Get-ChildItem -Path dist\AngelToggle -Recurse -Filter pyexpat.pyd | Select-Object -First 1
          if (-not $expat) { throw "pyexpat.pyd missing" }
          $qtwidgets = Get-ChildItem -Path dist\AngelToggle -Recurse -Filter QtWidgets.pyd | Select-Object -First 1
          if (-not $qtwidgets) { throw "QtWidgets.pyd missing" }
          $qwindows = Get-ChildItem -Path dist\AngelToggle -Recurse -Filter qwindows.dll | Select-Object -First 1
          if (-not $qwindows) { throw "qwindows.dll missing" }

      - name: Add Microsoft VC runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "dist\AngelToggle\vc_redist.x64.exe"
          if ((Get-Item "dist\AngelToggle\vc_redist.x64.exe").Length -lt 1000000) { throw "VC redistributable download failed" }

      - name: Smoke test application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\AngelToggle\AngelToggle.exe" -WorkingDirectory ".\dist\AngelToggle" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "AngelToggle exited during smoke test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer wizard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\AngelToggle.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path installer_output\AngelToggle-Setup.exe)) { throw "AngelToggle-Setup.exe missing" }

      - name: Verify installer by silent install
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "AngelToggle-Installer-Test"
          if (Test-Path $testDir) { Remove-Item -Recurse -Force $testDir }
          $p = Start-Process -FilePath ".\installer_output\AngelToggle-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon","/DIR=$testDir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer validation failed. ExitCode=$($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $testDir "AngelToggle.exe"))) { throw "Installed AngelToggle.exe missing" }
          Remove-Item -Recurse -Force $testDir

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngelToggle-Setup
          path: installer_output/AngelToggle-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v" + $env:APP_VERSION
          gh release create $tag installer_output\AngelToggle-Setup.exe --target $env:GITHUB_SHA --title "AngelToggle $tag" --notes "Windows installer wizard release"