name: Deploy AngelToggle Admin Pages

on:
  push:
    branches: [ main ]
    paths:
      - "admin-static/**"
      - ".github/workflows/admin-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: angeltoggle-admin-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload admin site
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-static
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
